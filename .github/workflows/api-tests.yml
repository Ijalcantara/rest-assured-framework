name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17 with Maven cache
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Run tests (exclude GoRest)
      - name: Run tests
        run: |
          mvn -q clean verify \
            -Denv=qa \
            -Dgroups="!gorest" \
            -Dallure.results.directory=target/allure-results \
            -Dmaven.test.failure.ignore=true

      # 4️⃣ Upload Surefire Reports (JUnit results)
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # 5️⃣ Debug: list Allure results
      - name: Check Allure results content
        if: always()
        run: |
          echo "Allure results files:"
          find target/allure-results -type f -exec ls -lh {} \; || true

      # 6️⃣ Generate Allure HTML report
      - name: Generate Allure HTML report
        if: always()
        run: |
          mvn -q allure:report \
            -Dallure.results.directory=target/allure-results \
            -Dallure.report.directory=target/allure-report

      # 7️⃣ Upload Allure report as artifact
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
