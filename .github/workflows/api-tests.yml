name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Run tests and produce Allure results
      - name: Run tests
        run: mvn clean test -Dallure.results.directory=target/allure-results

      # 4️⃣ Debug: list Allure results to confirm JSON files exist
      - name: List Allure results
        run: ls -l target/allure-results

      # 5️⃣ Install Allure CLI (latest release)
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.30.0
          curl -sSL https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip -o allure.zip
          unzip -q allure.zip -d $HOME/allure
          chmod +x $HOME/allure/allure-$ALLURE_VERSION/bin/allure
          export PATH=$HOME/allure/allure-$ALLURE_VERSION/bin:$PATH
          allure --version

      # 6️⃣ Generate full HTML report with index.html
      - name: Generate Allure HTML report
        run: |
          $HOME/allure/allure-2.30.0/bin/allure generate target/allure-results -o target/allure-report --clean

      # 7️⃣ Debug: list generated report folder contents
      - name: List Allure report contents
        run: ls -R target/allure-report

      # 8️⃣ Upload the full report folder as artifact
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report