name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17 with Maven cache
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Debug: check GOREST_TOKEN
      - name: Check GOREST_TOKEN
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          if [ -z "$GOREST_TOKEN" ]; then
            echo "GOREST_TOKEN is missing!"
            exit 1
          else
            echo "GOREST_TOKEN length: ${#GOREST_TOKEN}"
          fi

      # 4️⃣ Run tests (continue on failure)
      - name: Run tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          mvn clean test verify -Dallure.results.directory=target/allure-results || echo "Tests failed, continuing to generate report"

      # 5️⃣ Debug: list Allure results
      - name: List Allure results
        run: ls -R target/allure-results || echo "No results folder"

      # 6️⃣ Install latest Allure CLI
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.30.0
          curl -sSL https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip -o allure.zip
          unzip -q allure.zip -d $HOME/allure
          chmod +x $HOME/allure/allure-$ALLURE_VERSION/bin/allure
          export PATH=$HOME/allure/allure-$ALLURE_VERSION/bin:$PATH
          allure --version

      # 7️⃣ Generate Allure HTML report (even if some tests failed)
      - name: Generate Allure HTML report
        run: |
          echo "Generating Allure report..."
          mkdir -p target/allure-report
          $HOME/allure/allure-2.30.0/bin/allure generate target/allure-results -o target/allure-report --clean || echo "Failed to generate report"

      # 8️⃣ Debug: list report contents
      - name: List Allure report folder
        run: ls -R target/allure-report || echo "No report folder"

      # 9️⃣ Upload Allure report as artifact
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report