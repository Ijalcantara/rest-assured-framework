name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17 and Maven caching
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ List test files (optional debug)
      - name: List test files
        run: ls -R src/test/java

      # 4️⃣ Run tests and generate Allure results + HTML report
      - name: Run tests and generate Allure HTML report
        run: mvn clean test allure:report -Dallure.results.directory=target/allure-results

      # 5️⃣ Debug: list Allure report contents
      - name: List Allure report files
        run: ls -R target/allure-report

      # 6️⃣ Upload the full Allure HTML report as an artifact
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report