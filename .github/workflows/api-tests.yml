name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests to produce Allure results
        run: mvn clean test -Dallure.results.directory=target/allure-results

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.30.0
          curl -sSL https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip -o allure.zip
          unzip -q allure.zip -d $HOME/allure
          chmod +x $HOME/allure/allure-$ALLURE_VERSION/bin/allure
          export PATH=$HOME/allure/allure-$ALLURE_VERSION/bin:$PATH
          allure --version

      - name: Generate Allure HTML report
        run: |
          $HOME/allure/allure-2.30.0/bin/allure generate target/allure-results -o target/allure-report --clean

      - name: List Allure report files
        run: ls -R target/allure-report

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report