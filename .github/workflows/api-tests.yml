name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Run tests to produce Allure results
      - name: Run tests
        run: mvn clean test -Dallure.results.directory=target/allure-results

      # 4️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          sudo apt-add-repository ppa:qameta/allure -y
          sudo apt-get update
          sudo apt-get install allure -y
          allure --version

      # 5️⃣ Generate full HTML report (index.html)
      - name: Generate Allure HTML Report
        run: |
          allure generate target/allure-results -o target/allure-report --clean

      # 6️⃣ Debug: list generated report
      - name: List Allure report files
        run: ls -R target/allure-report

      # 7️⃣ Upload Allure report as artifact
      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report