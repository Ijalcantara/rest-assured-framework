name: API Test Automation

on:
  push:
    branches:
      - "**"

  repository_dispatch:
    types:
      - run-tests

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: qa
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Validate secret
      - name: Check GOREST_TOKEN
        run: |
          if [ -z "${{ secrets.GOREST_TOKEN }}" ]; then
            echo "GOREST_TOKEN is missing!"
            exit 1
          else
            echo "GOREST_TOKEN is present"
          fi

      # 4️⃣ Run tests
      - name: Run API tests
        run: |
          mvn clean test verify \
            -Dallure.results.directory=target/allure-results \
            -Dmaven.test.failure.ignore=true

      # 5️⃣ Verify results
      - name: Check Allure results
        run: |
          echo "Allure results:"
          find target/allure-results -type f || true

      # 6️⃣ Generate report
      - name: Generate Allure report
        run: |
          mvn allure:report \
            -Dallure.results.directory=target/allure-results \
            -Dallure.report.directory=target/allure-report

      # 7️⃣ Verify report
      - name: List report
        run: |
          ls -R target/allure-report || true

      # 8️⃣ Upload artifact
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report