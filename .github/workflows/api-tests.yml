name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK 17 and Maven caching
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 3️⃣ Run tests and generate Allure results
      - name: Run Tests and Generate Allure Results
        run: mvn clean verify -Dallure.results.directory=target/allure-results

      # 4️⃣ Verify that allure-results JSON files exist
      - name: List Allure Results
        run: |
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            echo "Allure JSON results found:"
            ls -lh target/allure-results
          else
            echo "ERROR: No Allure results found. Tests may not have produced steps or attachments."
            exit 1
          fi

      # 5️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 6️⃣ Generate full Allure HTML report
      - name: Generate Allure HTML Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report
          echo "Allure HTML report generated at target/allure-report"
          ls -lh target/allure-report

      # 7️⃣ Upload the report folder as artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report