name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Debug: Check if GOREST_TOKEN is available
      - name: Check GOREST_TOKEN
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          if [ -z "$GOREST_TOKEN" ]; then
            echo "GOREST_TOKEN is missing!"
            exit 1
          else
            echo "GOREST_TOKEN length: ${#GOREST_TOKEN}"
          fi

      # 4️⃣ Run tests (allow failure)
      - name: Run tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: mvn clean test -Dallure.results.directory=target/allure-results || true

      # 5️⃣ Debug: ensure results exist
      - name: List Allure results
        run: ls -l target/allure-results || echo "No results folder"

      # 6️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.30.0
          curl -sSL https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip -o allure.zip
          unzip -q allure.zip -d $HOME/allure
          chmod +x $HOME/allure/allure-$ALLURE_VERSION/bin/allure
          export PATH=$HOME/allure/allure-$ALLURE_VERSION/bin:$PATH
          allure --version

      # 7️⃣ Generate Allure HTML report (always run)
      - name: Generate Allure HTML report
        if: always()
        run: |
          $HOME/allure/allure-2.30.0/bin/allure generate target/allure-results -o target/allure-report --clean

      # 8️⃣ Debug: list report contents
      - name: List Allure report folder
        if: always()
        run: ls -R target/allure-report

      # 9️⃣ Upload Allure report as artifact (always run)
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report