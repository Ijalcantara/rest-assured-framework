name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 3️⃣ Run tests and generate Allure results
      - name: Run Tests and Generate Allure Results
        run: mvn clean verify -Dallure.results.directory=target/allure-results

      # 4️⃣ Debug step: show folder contents
      - name: Debug Allure Results
        run: |
          echo "Listing target/allure-results folder:"
          ls -R target/allure-results || echo "Folder not found"

      # 5️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 6️⃣ Generate Allure HTML report
      - name: Generate Allure HTML Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report
          echo "Allure HTML report generated at target/allure-report"
          ls -lh target/allure-report

      # 7️⃣ Upload report as artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report