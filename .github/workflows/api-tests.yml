name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK 17 and Maven caching
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Ensure Allure results folder exists
      - name: Prepare Allure results folder
        run: mkdir -p target/allure-results

      # 4️⃣ Run tests and generate Allure results
      - name: Run Tests
        run: mvn clean verify -Dallure.results.directory=target/allure-results

      # 5️⃣ Verify that Allure JSON results exist
      - name: Verify Allure JSON Results
        run: |
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            echo "✅ Allure JSON results found:"
            ls -lh target/allure-results
          else
            echo "❌ No Allure results found. Tests may not have produced steps or attachments."
            exit 1
          fi

      # 6️⃣ Install Allure CLI for HTML report generation
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxvf allure-2.25.0.tgz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 7️⃣ Generate Allure HTML report
      - name: Generate Allure HTML Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report
          echo "✅ Allure HTML report generated at target/allure-report"
          ls -lh target/allure-report

      # 8️⃣ Upload the report folder as artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report