name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK 17 and Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 3️⃣ Run tests (clean results + generate JSON)
      - name: Run Tests
        run: mvn clean verify

      # 4️⃣ Debug: check allure-results folder
      - name: List Allure Result Files
        run: |
          echo "Allure JSON results:"
          ls -lh target/allure-results || echo "No allure-results folder"

      # 5️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 6️⃣ Generate Allure HTML report
      - name: Generate Allure Report
        run: |
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            allure generate target/allure-results --clean -o target/allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi

      # 7️⃣ Upload Allure report as artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report