name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: List test files
        run: ls -R src/test/java

      - name: Run tests and generate Allure report
        run: |
          mvn clean test allure:report -Dallure.results.directory=target/allure-results

      - name: Verify Allure results
        run: |
          if compgen -G "target/allure-results/*" > /dev/null; then
            echo "✅ Allure results found"
          else
            echo "❌ No Allure results found"
            exit 1
          fi

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4   # ✅ fixed here
        with:
          name: allure-report
          path: target/allure-report